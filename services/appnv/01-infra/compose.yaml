services:
  tr:
    image: traefik
    container_name: tr
    volumes:
      - "{{ appdata_path }}/apps/traefik/letsencrypt:/letsencrypt"
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Lets Traefik route to services using network_mode: host, e.g. bambuddy.
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - traefik.enable=false
    security_opt:
      - apparmor:unconfined
    ports:
      - 80:80
      - 443:443
    environment:
      - CF_DNS_API_TOKEN={{ vault_cloudflare_dns_api_token }}
    command:
      - --log.level=info
      - --accesslog=false
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --certificatesresolvers.cloudflare.acme.email={{ vault_cloudflare_account_email }}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --serversTransport.insecureSkipVerify=true
    restart: unless-stopped
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane
    cgroup: host
    labels:
      - traefik.enable=true
      - "traefik.http.routers.arcane.rule=Host(`arcane.{{ m_wd_domain_me }}`)"
      - traefik.http.services.arcane.loadbalancer.server.port=3552
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "{{ appdata_path }}/apps/arcane:/app/data"
    env_file:
      - "{{ appdata_path }}/apps/arcane.env"
    environment:
      - APP_URL=https://arcane.{{ m_wd_domain_me }}
      - PUID={{ docker_compose_generator_uid }}
      - PGID={{ docker_compose_generator_gid }}
      - TZ={{ host_timezone }}
    healthcheck:
      test: [CMD, ./arcane, health, --timeout, 2s]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    labels:
      - traefik.enable=true
      - "traefik.http.routers.dockhand.rule=Host(`dockhand.{{ m_wd_domain_me }}`)"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "{{ appdata_path }}/apps/dockhand:/app/data"
    restart: unless-stopped
