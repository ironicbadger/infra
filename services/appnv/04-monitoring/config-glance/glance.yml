server:
  port: 8080

document:
  head: |
    <style>
      .monitor-site-icon {
        opacity: 1 !important;
        filter: saturate(1.3) !important;
      }
    </style>

theme:
  background-color: 0 0 16
  primary-color: 24 97 58
  negative-color: 209 88 54
  contrast-multiplier: 1.3

pages:
  - name: ktz.dash
    columns:
      - size: small
        widgets:
          - type: extension
            url: http://glance-ping-graph:8080
            allow-potentially-dangerous-html: true
            cache: 1m
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: America/New_York
                label: Raleigh
              - timezone: Europe/London
                label: London
          - type: weather
            location: Raleigh, North Carolina, United States
          - type: weather
            location: London, United Kingdom

      - size: full
        widgets:
          - type: bookmarks
            groups:
              - title: Media
                links:
                  - title: Jellyfin
                    url: https://jf.wd.ktz.me
                  - title: Wizarr
                    url: https://wizarr.m.wd.ktz.me
                  - title: Seerr
                    url: https://seerr.m.wd.ktz.me
                  - title: Audiobookshelf
                    url: https://audiobooks.wd.ktz.me
                  - title: Navidrome
                    url: https://navidrome.m.wd.ktz.me
                  - title: Calibre-Web Automated
