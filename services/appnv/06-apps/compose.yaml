services:
  miniflux:
    image: miniflux/miniflux:latest
    container_name: miniflux
    depends_on:
      - miniflux-db
    labels:
      - traefik.enable=true
      - "traefik.http.routers.miniflux.rule=Host(`miniflux.{{ m_wd_domain_me }}`)"
    environment:
      - "DATABASE_URL=postgres://{{ miniflux_db_user }}:{{ miniflux_db_password | urlencode }}@miniflux-db/{{ miniflux_db_name }}?sslmode=disable"
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=0
      - "ADMIN_USERNAME={{ miniflux_admin_user }}"
      - "ADMIN_PASSWORD={{ miniflux_admin_password }}"
      - OAUTH2_PROVIDER=oidc
      - "OAUTH2_CLIENT_ID={{ miniflux_oidc_client_id }}"
      - "OAUTH2_CLIENT_SECRET={{ miniflux_oidc_client_secret }}"
      - "OAUTH2_REDIRECT_URL=https://miniflux.{{ m_wd_domain_me }}/oauth2/oidc/callback"
      - "OAUTH2_OIDC_DISCOVERY_ENDPOINT={{ miniflux_oidc_discovery_endpoint }}"
      - OAUTH2_OIDC_PROVIDER_NAME=Tailscale
      - OAUTH2_USER_CREATION=0
      - FETCHER_ALLOW_PRIVATE_NETWORKS=1
    restart: unless-stopped
  miniflux-db:
    image: postgres:17
    container_name: miniflux-db
    volumes:
      - "{{ appdata_path }}/apps/miniflux/db:/var/lib/postgresql/data"
    environment:
      - "POSTGRES_USER={{ miniflux_db_user }}"
      - "POSTGRES_PASSWORD={{ miniflux_db_password }}"
      - "POSTGRES_DB={{ miniflux_db_name }}"
    restart: unless-stopped
  radicale:
    image: ghcr.io/kozea/radicale:stable
    container_name: radicale
    labels:
      - traefik.enable=true
      - "traefik.http.routers.radicale.rule=Host(`contacts.{{ domain_me }}`)"
      - traefik.http.services.radicale.loadbalancer.server.port=5232
    volumes:
      - "{{ appdata_path }}/apps/radicale/config:/etc/radicale:ro"
      - "{{ appdata_path }}/apps/radicale/data:/var/lib/radicale"
    restart: unless-stopped
  wallabag:
    image: wallabag/wallabag:latest
    container_name: wallabag
    volumes:
      - "{{ appdata_path }}/apps/wallabag:/var/www/wallabag/data"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.wallabag.rule=Host(`wallabag.{{ m_wd_domain_me }}`)"
    environment:
      - "SYMFONY__ENV__DOMAIN_NAME=https://wallabag.{{ m_wd_domain_me }}"
      - SYMFONY__ENV__DATABASE_DRIVER=pdo_sqlite
    restart: unless-stopped
  bambuddy:
    image: ghcr.io/maziggy/bambuddy:latest
    container_name: bambuddy
    cap_add:
      - NET_BIND_SERVICE
    network_mode: host
    labels:
      - traefik.enable=true
      - "traefik.http.routers.bambuddy.rule=Host(`bambuddy.{{ m_wd_domain_me }}`)"
      - traefik.http.services.bambuddy.loadbalancer.server.port=8000
    volumes:
      - "{{ appdata_path }}/apps/bambuddy/data:/app/data"
      - "{{ appdata_path }}/apps/bambuddy/logs:/app/logs"
    environment:
      - "TZ={{ host_timezone }}"
      - "PUID={{ docker_compose_generator_uid }}"
      - "PGID={{ docker_compose_generator_gid }}"
      - PORT=8000
    restart: unless-stopped
  actual-budget:
    image: actualbudget/actual-server:26.9.0@sha256:552beab3dec8c93d46b8b9245612d63c3f123b8a45063a474f53e229b17621d3
    container_name: actual-budget
    restart: unless-stopped
    ports:
      - "127.0.0.1:5006:5006"
    volumes:
      - /mnt/nvmeu2/appdata/apps/actual-budget/data:/data
    labels:
      traefik.enable: "true"
      traefik.docker.network: root_default
      traefik.http.routers.actual-budget.rule: "Host(`actual.{{ m_wd_domain_me }}`)"
      traefik.http.routers.actual-budget.entrypoints: websecure
      traefik.http.routers.actual-budget.tls: "true"
      traefik.http.routers.actual-budget.tls.certresolver: cloudflare
      traefik.http.routers.actual-budget.middlewares: actual-budget-private
      traefik.http.routers.actual-budget.observability.accesslogs: "false"
      traefik.http.routers.actual-budget.observability.tracing: "false"
      traefik.http.middlewares.actual-budget-private.ipallowlist.sourcerange: "10.42.0.0/21,100.64.0.0/10,fd7a:115c:a1e0::/48,127.0.0.1/32"
      traefik.http.services.actual-budget.loadbalancer.server.port: "5006"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: none
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5006/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 10s
      start_interval: 2s
      timeout: 10s
      retries: 3
