---
- name: Core edge nodes (DNS + VIP)
  hosts: core
  become: true

  pre_tasks:
    - name: Set timezone
      community.general.timezone:
        name: America/New_York

  roles:
    - role: ironicbadger.packages
      tags: packages

    - role: core-network
      tags: network

    - role: core-chrony
      tags: chrony

    - role: core-adguardhome
      tags: adguard

    - role: core-caddy
      tags: caddy

    - role: core-m90q-ingress
      when: m90q_ingress_enabled | default(false)
      tags: m90q-ingress

    - role: core-keepalived
      tags: keepalived

    - role: core-adguardhome-sync
      tags: sync
